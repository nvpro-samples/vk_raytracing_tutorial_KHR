<text class="t" x="70" y="45">Sphere surface as a latitude-longitude grid (8 x 16 cells)</text>
<text class="s" x="70" y="68">Each 4x4-cell patch becomes one cluster - here 2 x 4 = 8 clusters (level 0)</text>
