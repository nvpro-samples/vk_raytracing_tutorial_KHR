<text class="s" x="70" y="434">A cluster stores its own local vertices and 8-bit triangle indices, so it must stay within the</text>
<text class="s" x="70" y="456">per-cluster limits (256 vertices with 8-bit indices). Finer levels use more, smaller patches.</text>
